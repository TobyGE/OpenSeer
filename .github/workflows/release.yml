name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Also publish artifacts to PyPI (Trusted Publishing). Tag pushes always publish; this flag only matters for manual runs."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Check tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          expected = f"v{version}"
          if tag != expected:
              print(f"Tag {tag!r} does not match pyproject version {version!r}.")
              print(f"Create tag {expected!r}, or bump [project].version first.")
              sys.exit(1)
          PY

      - name: Build wheel and sdist
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes always publish; manual `workflow_dispatch` runs only
    # publish when the `publish_pypi` input is set, per RELEASING.md.
    # PyPI is irreversible (yank only) so the manual path stays opt-in.
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch'
          && inputs.publish_pypi)
    # PyPI Trusted Publishing matches the GitHub OIDC token against
    # the (owner, repo, workflow, environment) the project trusts.
    # RELEASING.md documents these as: TobyGE / OpenSeer /
    # release.yml / pypi. The id-token: write permission is what
    # lets the OIDC handshake happen.
    environment:
      name: pypi
      url: https://pypi.org/project/openseer/
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
