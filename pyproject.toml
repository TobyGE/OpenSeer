[build-system]
# setuptools 77 was the first release to recognise PEP 639 bare SPDX
# license expressions (`license = "Apache-2.0"` below). Older versions
# only validate `{text=...}`/`{file=...}` and reject this config at
# build time, breaking sdist/wheel.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openseer"
version = "0.1.10"
description = "Sees. Remembers. Acts. — a chat-first, memory-aware, computer-use agent for macOS."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Yingqiang Ge" }]
keywords = ["agent", "computer-use", "ai", "macos", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Pillow>=10.0",
    "pyautogui>=0.9.54",
    # WebSocket server for `openseer agentd` — one long-running Python
    # process that the GUI / voice orb / CLI / telegram all talk to,
    # instead of every client spawning its own `openseer task`
    # subprocess and tailing events.jsonl.
    "websockets>=12.0",
    "pyobjc-framework-Quartz>=10.0; platform_system == 'Darwin'",
    "pyobjc-framework-Cocoa>=10.0; platform_system == 'Darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; platform_system == 'Darwin'",
    # Security framework for non-argv keychain writes (avoids
    # leaking OAuth tokens through `ps` while `/usr/bin/security
    # add-generic-password -w "<token>"` is running).
    "pyobjc-framework-Security>=10.0; platform_system == 'Darwin'",
]

[project.urls]
Homepage = "https://github.com/TobyGE/OpenSeer"
Issues = "https://github.com/TobyGE/OpenSeer/issues"

[project.scripts]
openseer = "openseer.cli:main"

[tool.setuptools.packages.find]
# Includes both `openseer` (the main package) and `openseer_ax` (the
# AX wrapper, lifted to its own top-level package so it can be used
# standalone). They live in the same wheel for now; eventually
# `openseer_ax` may move out to its own repo + PyPI release without
# breaking callers thanks to the openseer/ax.py compatibility shim.
include = ["openseer*", "openseer_ax*"]

[tool.setuptools.package-data]
openseer = ["skills/**/*.md", "voice_listen.swift"]
