[build-system]
# setuptools 77 was the first release to recognise PEP 639 bare SPDX
# license expressions (`license = "Apache-2.0"` below). Older versions
# only validate `{text=...}`/`{file=...}` and reject this config at
# build time, breaking sdist/wheel.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openseer"
version = "0.1.5"
description = "Sees. Remembers. Acts. — a chat-first, memory-aware, computer-use agent for macOS."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Yingqiang Ge" }]
keywords = ["agent", "computer-use", "ai", "macos", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Pillow>=10.0",
    "pyautogui>=0.9.54",
    "pyobjc-framework-Quartz>=10.0; platform_system == 'Darwin'",
    "pyobjc-framework-Cocoa>=10.0; platform_system == 'Darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; platform_system == 'Darwin'",
]

[project.urls]
Homepage = "https://github.com/TobyGE/OpenSeer"
Issues = "https://github.com/TobyGE/OpenSeer/issues"

[project.scripts]
openseer = "openseer.cli:main"

[tool.setuptools.packages.find]
include = ["openseer*"]

[tool.setuptools.package-data]
openseer = ["skills/**/*.md"]
